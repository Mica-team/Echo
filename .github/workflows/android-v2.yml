name: Echo Android v2

on:
  push:
    branches:
      - main
      - rebuild/android-v2
  pull_request:
    branches:
      - main
      - rebuild/android-v2
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: echo-android-v2-debug
          path: app/build/outputs/apk/debug/*.apk

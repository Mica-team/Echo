name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Configure Echo signing keystore
        if: ${{ github.event_name == 'push' && secrets.ECHO_KEYSTORE_BASE64 != '' }}
        env:
          ECHO_KEYSTORE_BASE64: ${{ secrets.ECHO_KEYSTORE_BASE64 }}
          ECHO_KEYSTORE_PASSWORD: ${{ secrets.ECHO_KEYSTORE_PASSWORD }}
          ECHO_KEY_ALIAS: ${{ secrets.ECHO_KEY_ALIAS }}
          ECHO_KEY_PASSWORD: ${{ secrets.ECHO_KEY_PASSWORD }}
        run: |
          printf '%s' "$ECHO_KEYSTORE_BASE64" | base64 --decode > echo-release.jks
          cat > keystore.properties <<EOF
          storeFile=echo-release.jks
          storePassword=$ECHO_KEYSTORE_PASSWORD
          keyAlias=$ECHO_KEY_ALIAS
          keyPassword=$ECHO_KEY_PASSWORD
          EOF
          chmod 600 echo-release.jks keystore.properties

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Build release APK
        if: ${{ github.event_name == 'push' && secrets.ECHO_KEYSTORE_BASE64 != '' }}
        run: ./gradlew assembleRelease

      - name: Verify signed APK certificate
        if: ${{ github.event_name == 'push' && secrets.ECHO_KEYSTORE_BASE64 != '' }}
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          echo "Debug APK certificate:"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk
          echo "Release APK certificate:"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Clean signing material
        if: always()
        run: |
          rm -f echo-release.jks keystore.properties

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: echo-android-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
